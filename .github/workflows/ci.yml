# Every push and pull request: the Minecraft module's checks, the frontend's,
# then the Rust workspace's lint gate and tests -- the same commands README.md
# lists for a local build. The launcher's build script embeds the client jar,
# so the module is built first.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Gradle runs on 17; the module compiles for players' Java 8 through a toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Minecraft module (build and core suites)
        working-directory: minecraft/fathom-optimizations
        run: gradle build

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Frontend (install, check, test)
        working-directory: desktop
        run: |
          npm ci
          npm run check
          npm test

      # rust-toolchain.toml pins the compiler, so the lint gate does not move under us.
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --lib --bins --tests
