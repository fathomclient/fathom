<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No remote origins at all. The frontend renders; it never fetches.
         `media-src` covers the background videos, which are bundled assets. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fathom</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
