// Fathom Optimizations — the Minecraft-side module.
//
// The `core` package has no Minecraft or Fabric dependencies and compiles with a bare
// JDK 8 (see README.md and tools/build-optimization-module.ps1). The `fabric` package
// needs this build: Loom resolves Minecraft, the Legacy Fabric intermediary and the yarn
// mappings, and remaps the Mixins against them.

plugins {
    // Pinned to a released version. This was `1.7-SNAPSHOT`, a mutable
    // coordinate: the artifact behind it can change without the version
    // changing, so a build was neither reproducible nor auditable. That was an
    // open finding in THREAT_MODEL.md; 1.7.4 is the released build and closes
    // it.
    id 'fabric-loom' version '1.7.4'
    id 'java'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

// ---------------------------------------------------------------------------
// NanoVG foundation -- see docs/ingame-ui-nanovg.md
// ---------------------------------------------------------------------------
//
// NanoVG on 1.8.9 means LWJGL 3 beside the game's LWJGL 2.9.4, and the two
// cannot share a classloader: both define org.lwjgl.BufferUtils,
// org.lwjgl.PointerBuffer and the org.lwjgl.opengl.GL* classes, with different
// APIs. NanoVG's GL backend also looks up org.lwjgl.opengl.GL by name for its
// function pointers, so LWJGL 3's OpenGL module has to come too. None of it may
// go on the game's classpath.
//
//   lwjgl3   the LWJGL 3 jars and this machine's natives, resolved on their own.
//   nanovg   a source set compiled against LWJGL 3 and Fathom's `core` only --
//            never against Minecraft or LWJGL 2 -- whose classes are loaded
//            together with `lwjgl3` into an isolated, child-first classloader
//            (fabric/gfx/nanovg/NanoVg.java).
//
// Development only in this phase: `gradle runClient -Pnanovg`, or
// `-PcaptureUi=nanovg` (screenshot) or `nanovg-live` for the renderer showcase. Nothing here is packaged into
// the mod jar yet; how that should be done is the next phase.

def lwjgl3Natives = { ->
    String os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
    String arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
    boolean arm = arch.contains('aarch64') || arch.contains('arm64')
    if (os.contains('win')) return arm ? 'natives-windows-arm64' : 'natives-windows'
    if (os.contains('mac')) return arm ? 'natives-macos-arm64' : 'natives-macos'
    return arm ? 'natives-linux-arm64' : 'natives-linux'
}()

def nanovgWanted = project.hasProperty('nanovg') ||
        String.valueOf(project.findProperty('captureUi')).toLowerCase().startsWith('nanovg')

configurations {
    lwjgl3 {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    nanovg {
        java.srcDir 'src/nanovg/java'
    }
}

def nanovgClasspathFile = layout.buildDirectory.file('nanovg/classpath.txt')

// Legacy Fabric publishes its own intermediary mappings for the versions Mojang
// predates Fabric on. Without this, Loom looks for 1.8.9 intermediary on the
// modern Fabric maven, where it does not exist.
loom {
    intermediaryUrl = 'https://maven.legacyfabric.net/net/fabricmc/intermediary/%1$s/intermediary-%1$s-v2.jar'

    // WORKFLOW B -- game-side module development.
    //
    // `gradle runClient` starts a real, decompiled-against, mod-loaded
    // Minecraft 1.8.9 through Loom's own tooling. That is the legitimate way to
    // develop a Fabric mod, and it is how this module gets tested inside the
    // game while Fathom's production Microsoft authentication is pending
    // approval.
    //
    // WHAT THIS IS NOT: a way to play. Loom's development client runs
    // unauthenticated, so it can reach singleplayer and nothing else -- no
    // online-mode server will accept it, because there is no session to
    // validate. That is a property of having no credential, not a restriction
    // we added, and it is exactly why this is an acceptable development path
    // and not a bypass.
    //
    // The run directory is inside the module's own build tree, so a developer's
    // real `.minecraft` is never touched.
    runs {
        client {
            client()
            setConfigName('Fathom Module (development)')
            ideConfigGenerated(true)
            runDir('run')

            // Opt-in visual QA: capture the menu through Minecraft's own
            // framebuffer path, then stop. These flags are absent from
            // ordinary builds.
            //
            //   gradle runClient -PcaptureMenu
            //   gradle runClient -PcaptureMenu -PcaptureFrame=4   (mid-opening)
            //
            // The frame number exists because the opening animation is part of
            // the specification and "it compiles" is not evidence that it runs.
            if (project.hasProperty('captureMenu')) {
                vmArg '-Dfathom.captureMenu=true'
                if (project.hasProperty('captureFrame')) {
                    vmArg "-Dfathom.captureMenuFrame=${project.property('captureFrame')}"
                }
            }
            if (project.hasProperty('captureVideoFrames')) {
                vmArg "-Dfathom.captureMenuVideoFrames=${project.property('captureVideoFrames')}"
            }
            if (project.hasProperty('captureUi')) {
                vmArg "-Dfathom.captureUi=${project.property('captureUi')}"
                if ('menu'.equalsIgnoreCase(project.property('captureUi').toString())) {
                    vmArg '-Dfathom.captureMenu=true'
                }
            }
            if (project.hasProperty('captureHudItems')) {
                // Visual QA only: dresses the development player in armour and
                // two effects so the armour and potion widgets have something
                // to draw in an in-game HUD capture.
                vmArg '-Dfathom.captureHudItems=true'
            }
            if (project.hasProperty('hudProfile')) {
                // Development measurement: prints what each HUD widget costs.
                vmArg '-Dfathom.hudProfile=true'
            }
            if (project.hasProperty('railOpen')) {
                vmArg '-Dfathom.captureRail=true'
            }
            if (project.hasProperty('hoverProbe')) {
                vmArg '-Dfathom.hoverInstrumentation=true'
            }
            if (project.hasProperty('qaAllModules')) {
                // Visual-only stress mode: renders every module card as enabled
                // without changing the user's saved module configuration.
                vmArg '-Dfathom.qaAllModules=true'
            }
            if (project.hasProperty('qaOpenSettings')) {
                // Visual-only detail-state capture; never changes saved settings.
                // The value may be a module id, to capture one drawer.
                vmArg "-Dfathom.qaOpenSettings=${project.property('qaOpenSettings')}"
            }
            if (project.hasProperty('qaPointer')) {
                // Visual-only: fixed pointer position (UI units, "x,y") for hover captures.
                vmArg "-Dfathom.qaPointer=${project.property('qaPointer')}"
            }
            if (project.hasProperty('qaFocusSearch')) {
                vmArg '-Dfathom.qaFocusSearch=true'
            }
            if (project.hasProperty('qaReplay')) {
                // Visual-only: replay page switch + card activation, capture N seconds in.
                vmArg "-Dfathom.qaReplay=${project.property('qaReplay')}"
            }
            if (project.hasProperty('perfBench')) {
                // Development-only scripted benchmark: `world` (gameplay
                // scenarios in the dev save) or `soak` (long-open screens).
                // Results print as `[Fathom] Bench` lines and are written to
                // run/fathom-bench/<label>-<scenario>.json.
                vmArg "-Dfathom.perfBench=${project.property('perfBench')}"
                vmArg "-Dfathom.perfBench.label=${project.findProperty('perfLabel') ?: 'run'}"
                ['off', 'on', 'ab', 'window', 'joinSettle', 'abScenarios', 'abReverse'].each { key ->
                    if (project.hasProperty("perf${key.capitalize()}")) {
                        vmArg "-Dfathom.perfBench.${key}=${project.property("perf${key.capitalize()}")}"
                    }
                }
                ['seconds', 'settle', 'soakSeconds'].each { key ->
                    if (project.hasProperty("perf${key.capitalize()}")) {
                        vmArg "-Dfathom.perfBench.${key}=${project.property("perf${key.capitalize()}")}"
                    }
                }
            }
            if (project.hasProperty('jfrFile')) {
                // Sampling profile of a run, read with JDK 17's `jfr print`.
                vmArg "-XX:StartFlightRecording=settings=profile,filename=${project.property('jfrFile')}"
            }
            if (project.hasProperty('transitionProbe')) {
                vmArg '-Dfathom.transitionInstrumentation=true'
            }
            if (project.hasProperty('profilesDir')) {
                vmArg "-Dfathom.profilesDir=${project.property('profilesDir')}"
            }
            if (project.hasProperty('hudFont')) {
                vmArg "-Dfathom.hudFont=${project.property('hudFont')}"
            }
            if (project.hasProperty('qualityUi')) {
                vmArg "-Dfathom.highQualityUi=${project.property('qualityUi')}"
            }
            // NanoVG foundation: where the isolated classpath is listed.
            // `writeNanoVgClasspath` produces the file before the client starts.
            if (nanovgWanted) {
                vmArg "-Dfathom.nanovg.classpathFile=${nanovgClasspathFile.get().asFile.absolutePath}"
            }

            // Point the module at a config file in the run directory, so the
            // launcher's own `config/fathom-performance.properties` contract can
            // be exercised by hand: edit that file, restart, observe.
            def clientWidth = project.findProperty('clientWidth') ?: '1280'
            def clientHeight = project.findProperty('clientHeight') ?: '720'
            programArgs('--width', clientWidth.toString(), '--height', clientHeight.toString())
        }
    }
}

repositories {
    // Legacy Fabric first: it hosts the 1.8.9 intermediary mappings.
    maven {
        name = 'Legacy Fabric'
        url = 'https://maven.legacyfabric.net/'
    }
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.legacyfabric:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // LWJGL 3, for the NanoVG backend only -- see the NanoVG section above. The
    // `lwjgl3` configuration is never added to the game's classpath, and the
    // `nanovg` source set compiles against LWJGL 3 and Fathom's core alone.
    ['lwjgl', 'lwjgl-opengl', 'lwjgl-nanovg'].each { module ->
        lwjgl3 "org.lwjgl:${module}:${project.lwjgl3_version}"
        lwjgl3 "org.lwjgl:${module}:${project.lwjgl3_version}:${lwjgl3Natives}"
        nanovgCompileOnly "org.lwjgl:${module}:${project.lwjgl3_version}"
    }
    nanovgCompileOnly sourceSets.main.output

    // Deliberately no Fabric API dependency yet. This milestone adds instrumentation and
    // architecture, not gameplay hooks, and every dependency is one more thing a user has
    // to have installed for the mod to load.

    // No test dependency. The tests are plain `main` methods
    // (`CoreTests`, `OptTests`) so that `core` can be verified with nothing but
    // a JDK -- which is how it was verified, because this build has never run.
    // Adding JUnit would be a dependency carried for tests that do not use it.
}

java {
    // Two different Javas, on purpose.
    //
    // Gradle and Loom themselves need Java 17 to run. The mod must be Java 8
    // bytecode, because that is what Minecraft 1.8.9 declares and what its
    // players have. A toolchain expresses exactly that: build on 17, compile
    // with the JDK 8 that is installed alongside it.
    //
    // This replaces `sourceCompatibility`/`targetCompatibility` plus
    // `options.release = 8`. `--release` is a JDK 9+ flag, so asking a JDK 8
    // javac for it fails outright.
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
    withSourcesJar()
}

/**
 * The shared theme constants, regenerated from the manifest before Java compiles.
 *
 * <p>`generated/FathomTheme.java` and the launcher's CSS and TypeScript come from
 * one manifest through one script. Running it here means an edited manifest
 * cannot ship a jar compiled against stale constants; the script rewrites a file
 * only when its content changes, so an unchanged manifest leaves this up to date.
 * Node is already required to build the launcher.
 */
def repoRoot = rootProject.projectDir.parentFile.parentFile
def generateThemeTokens = tasks.register('generateThemeTokens', Exec) {
    inputs.file(new File(repoRoot, 'assets/theme/fathom-theme.json'))
    inputs.file(new File(repoRoot, 'tools/generate-fathom-theme.mjs'))
    outputs.file('src/main/java/net/fathom/optimizations/generated/FathomTheme.java')
    workingDir repoRoot
    commandLine 'node', 'tools/generate-fathom-theme.mjs'
}

// Both tasks read `src/main/java`, which contains the generated file, so both
// must run after it; Gradle refuses the build otherwise.
tasks.named('compileJava').configure { dependsOn generateThemeTokens }
tasks.named('sourcesJar').configure { dependsOn generateThemeTokens }

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // -Xlint:all with no -Werror: a warning here should be read, not fatal, because the
    // Mixin annotation processor emits some that are not ours to fix.
    it.options.compilerArgs << '-Xlint:all'
}

/**
 * The build identity stamped into the jar.
 *
 * <p>Three different jars have been called `fathom-optimizations-0.3.0-hud.jar`
 * in this checkout's history, and the version string cannot tell them apart. A
 * commit and a build time can, so the runtime can say which bytes it is and a
 * stale jar reports itself instead of being mistaken for the new one.
 *
 * <p>Read at configuration time rather than baked into a constant: a source file
 * holding a commit hash would have to be edited by the build and is then a file
 * that is always dirty.
 */
static String gitDescribe(File root) {
    try {
        def proc = ['git', 'rev-parse', '--short=12', 'HEAD'].execute(null, root)
        def head_out = new StringWriter()
        def head_err = new StringWriter()
        proc.consumeProcessOutput(head_out, head_err)
        proc.waitForOrKill(10000)
        if (proc.exitValue() != 0) {
            return 'unknown'
        }
        def head = head_out.toString().trim()
        // `git diff --quiet` rather than `git status --porcelain`: it answers with
        // an exit code and prints nothing. The porcelain form prints a line per
        // modified file, which on a working tree of any size fills the pipe buffer
        // and deadlocks a Groovy `execute()` that is not draining it -- the check
        // then times out and every build quietly reports itself as clean.
        def dirtyProc = ['git', 'diff', '--quiet', 'HEAD'].execute(null, root)
        dirtyProc.consumeProcessOutput()
        dirtyProc.waitForOrKill(10000)
        def dirty = dirtyProc.exitValue() != 0
        return dirty ? head + '-dirty' : head
    } catch (Exception ignored) {
        // A build from a source archive has no git. That is a legitimate build
        // and must not fail; it simply cannot name a commit.
        return 'unknown'
    }
}

ext.fathomCommit = gitDescribe(rootProject.projectDir)
ext.fathomBuiltAt = new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone('UTC'))

processResources {
    inputs.property 'version', project.version
    inputs.property 'commit', project.ext.fathomCommit
    inputs.property 'builtAt', project.ext.fathomBuiltAt
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    // Generated rather than checked in: it describes this build, and a checked-in
    // copy would describe whichever build last committed it.
    doLast {
        def target = new File(destinationDir, 'fathom-build.properties')
        target.parentFile.mkdirs()
        target.withWriter('UTF-8') { writer ->
            writer.writeLine("version=${project.version}")
            writer.writeLine("commit=${project.ext.fathomCommit}")
            writer.writeLine("builtAt=${project.ext.fathomBuiltAt}")
        }
    }
}

jar {
    from('../../LICENSE') {
        // If a licence file exists at the repository root it travels with the jar.
        // Shipping code without one is the mistake mod-policies.md §5 is about.
        rename { "${it}_${project.archives_base_name}" }
    }
}

// The core has no Minecraft dependencies, so its tests run on a plain JVM. Under Gradle
// they are ordinary JUnit tests; the same assertions also run standalone via
// net.fathom.optimizations.core.CoreTests, which is how they were verified for this
// milestone.
test {
    useJUnit()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

// The core suites are `main` methods, not JUnit: the point of the core/fabric
// split is that the core has no dependencies, and adding a test framework to
// prove that would defeat it. `gradle test` therefore finds nothing to run, so
// the suites are executed here instead — one JVM each, failing the build on a
// non-zero exit.
def coreSuites = [
        'net.fathom.optimizations.core.ConfigTests',
        'net.fathom.optimizations.core.CoreTests',
        'net.fathom.optimizations.core.FeatureTests',
        'net.fathom.optimizations.core.HudTests',
        'net.fathom.optimizations.core.ModuleTests',
        'net.fathom.optimizations.core.OptTests',
        'net.fathom.optimizations.core.UiTests',
        'net.fathom.optimizations.core.ProfileTests',
        'net.fathom.optimizations.core.ProfileLocationTests',
        'net.fathom.optimizations.core.AccountTests',
        'net.fathom.optimizations.core.BenchmarkTests',
]

def coreTest = tasks.register('coreTest') {
    group = 'verification'
    description = 'Runs the dependency-free core suites.'
    dependsOn tasks.named('testClasses')
    doLast {
        coreSuites.each { suite ->
            javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass = suite
            }
        }
    }
}

tasks.named('check').configure { dependsOn coreTest }

// The NanoVG backend is not on the game classpath, so nothing else compiles it.
// Checking it here stops it rotting between development runs; it resolves only
// LWJGL 3's compile-time jars, never natives, and nothing is packaged.
tasks.named('check').configure { dependsOn tasks.named('nanovgClasses') }

// The NanoVG backend's classes and LWJGL 3, listed one per line for the
// development client to load in isolation. Written at execution time, so a build
// that does not ask for NanoVG never resolves LWJGL 3 at all.
def writeNanoVgClasspath = tasks.register('writeNanoVgClasspath') {
    group = 'build'
    description = 'Lists the isolated classpath the NanoVG backend is loaded from.'
    dependsOn tasks.named('nanovgClasses')
    def entries = sourceSets.nanovg.output.classesDirs + configurations.lwjgl3
    inputs.files(entries)
    outputs.file(nanovgClasspathFile)
    doLast {
        File out = nanovgClasspathFile.get().asFile
        out.parentFile.mkdirs()
        out.text = entries.files.collect { it.absolutePath }.join(System.lineSeparator())
    }
}

if (nanovgWanted) {
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn writeNanoVgClasspath }
}
