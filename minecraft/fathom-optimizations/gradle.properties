# Fathom Optimizations
#
# The Minecraft-side half of the project. Deliberately a separate module from the Rust
# launcher: different language, different toolchain, different release cadence, and a
# licence question the launcher does not have.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# The component version. The launcher pins this; see crates/launcher-core/src/mods/catalog.rs.
mod_version=0.3.0-hud
maven_group=net.fathom
archives_base_name=fathom-optimizations

# Target platform. These are facts from the 1.8.9 version manifest, not preferences:
# 1.8.9 declares javaVersion.majorVersion = 8, and LWJGL 2.9.4.
minecraft_version=1.8.9
yarn_mappings=1.8.9+build.604
loader_version=0.19.3
java_version=8

# LWJGL 3, for the NanoVG renderer backend only. It is never on the game's
# classpath -- 1.8.9 ships LWJGL 2.9.4 and the two define the same class names
# with different APIs. See the NanoVG section of build.gradle and
# docs/ingame-ui-nanovg.md. 3.3.6 is the last release of the 3.3 line; every
# class in lwjgl, lwjgl-opengl and lwjgl-nanovg at this version was checked to be
# Java 8 bytecode (class-file major 52).
lwjgl3_version=3.3.6
