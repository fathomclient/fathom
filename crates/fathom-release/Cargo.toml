[package]
name = "fathom-release"
description = "Offline release signing for Fathom. Never linked into a shipped binary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The launcher's own verification code. Depending on it is the point: the
# signer computes the signed preimage with the same function the verifier uses,
# so a signature this tool makes is one the launcher can check by construction.
launcher-core.workspace = true

serde.workspace = true
serde_json.workspace = true
base64.workspace = true

# The only crate in the workspace that needs a private key type, and the only
# one that needs randomness. `rand_core` comes with the `rand_core` feature.
ed25519-dalek = { version = "2.2", default-features = false, features = [
    "std",
    "rand_core",
    "zeroize",
] }
rand_core = { version = "0.6", features = ["getrandom"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
