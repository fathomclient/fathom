[package]
name = "launcher-core"
description = "UI-agnostic core services for the launcher: auth, network policy, downloads, profiles, Minecraft runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Compiles a fake local authentication provider for launcher development while
# Microsoft application approval is pending. NEVER enable this for a release
# build: `auth/development.rs` contains a `compile_error!` that turns the
# combination into a build failure. See docs/research/auth-feasibility.md.
dev-auth = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
ureq.workspace = true
sha1.workspace = true
sha2.workspace = true
base64.workspace = true
png.workspace = true
jsonwebtoken.workspace = true
keyring.workspace = true
zip.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The update tests build real signed documents, which needs the private-key
# half. Dev-only: `fathom-release` is the only place a real key is ever made.
ed25519-dalek = { workspace = true, features = ["rand_core"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Deliberate: these fire constantly on domain code and add no safety.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Real hazards for this codebase.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
