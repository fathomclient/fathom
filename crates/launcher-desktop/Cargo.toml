[package]
name = "launcher-desktop"
description = "Fathom's desktop shell: a Tauri window around launcher-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "fathom-desktop"
path = "src/main.rs"

[features]
# Serve the interface from inside the executable rather than from a dev server.
#
# THIS IS REQUIRED FOR ANY BUILD A USER RUNS. Tauri decides between "load
# `frontendDist` embedded in the binary" and "load `devUrl` over HTTP" from this
# feature and nothing else -- `tauri-macros` does it as
# `dev: cfg!(not(feature = "custom-protocol"))`. It is NOT tied to debug versus
# release, so `cargo build --release` without it produces an executable that
# opens on "localhost refused to connect".
#
# The Tauri CLI passes this automatically during `tauri build`. This project
# builds with plain cargo, so `tools/package-portable.ps1` passes it explicitly
# and then verifies it took effect.
#
# Left out of `default` on purpose: `npm run dev` plus `cargo run` is the
# iteration loop, and that loop wants the dev server with its hot reload.
custom-protocol = ["tauri/custom-protocol"]

default = []
# Forwards to launcher-core's dev-auth. Never enable for a release build.
dev-auth = ["launcher-core/dev-auth"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
launcher-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# The window and the command bridge, and nothing else.
#
# No plugins: every capability a plugin would add -- filesystem, shell, http,
# dialog -- is either something the frontend must not have, or something
# launcher-core already does behind a typed command. `tauri` itself is the whole
# surface, which is the smallest this can be while still opening a window.
tauri = { version = "2", features = [] }

# The native file picker, on the Rust side of the boundary.
#
# Deliberately this rather than Tauri's dialog plugin. A plugin would put a
# general "open a dialog" capability in the WebView's hands; this keeps the
# picker where the filesystem access already is -- the frontend asks "add a
# mod", and Rust opens the dialog, reads the file and copies it into the store.
# The interface never learns the path.
rfd = { version = "0.15", default-features = false, features = ["common-controls-v6"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
